name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Three test files at a time: GitHub's runner is small, and each browser
      # test file starts a Chromium of its own (npm test runs six locally).
      - run: npm run test:ci
