name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The unit tests, then the browser tests one file at a time: each starts
      # a Chromium of its own, and GitHub's runner is small.
      - run: npm run test:ci
